name: Capgo Live Update

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy-live-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set dynamic build version
        run: |
          # 1. Read major.minor version and current patch from package.json
          BASE_VERSION=$(node -p "const v = require('./package.json').version.split('.'); v[0] + '.' + v[1]")
          FILE_PATCH=$(node -p "require('./package.json').version.split('.')[2] || 0")
          
          # 2. Add GITHUB_RUN_NUMBER to the patch to ensure uniqueness and strictly increasing progression
          PATCH_VERSION=$((FILE_PATCH + ${{ github.run_number }}))
          NEW_VERSION="${BASE_VERSION}.${PATCH_VERSION}"
          echo "Setting dynamic build version to: $NEW_VERSION"
          
          # 3. Export to environment for node process to access securely without shell interpolation issues
          export NEW_VERSION
          node -e '
          const fs = require("fs");
          const nv = process.env.NEW_VERSION;
          
          // Update package.json
          const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
          pkg.version = nv;
          fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n", "utf8");

          // Update src/types.ts safely using standard regex or simple replace
          if (fs.existsSync("src/types.ts")) {
            let types = fs.readFileSync("src/types.ts", "utf8");
            types = types.replace(/export\s+const\s+CURRENT_VERSION\s*=\s*(["\x27])[^"\x27]+(["\x27])/, `export const CURRENT_VERSION = \x27${nv}\x27`);
            fs.writeFileSync("src/types.ts", types, "utf8");
          }

          // Update public/version.json
          if (fs.existsSync("public/version.json")) {
            const v = JSON.parse(fs.readFileSync("public/version.json", "utf8"));
            v.version = nv;
            const d = new Date();
            const day = String(d.getDate()).padStart(2, "0");
            const month = String(d.getMonth() + 1).padStart(2, "0");
            const year = d.getFullYear();
            v.releaseDate = day + "/" + month + "/" + year;
            fs.writeFileSync("public/version.json", JSON.stringify(v, null, 2) + "\n", "utf8");
          }
          '

      - name: Build production app
        run: npx vite build

      - name: Upload and deploy to Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_API_KEY }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "::error::CAPGO_API_KEY secret is not configured in your GitHub repository secrets! Please set CAPGO_API_KEY in your GitHub Settings -> Secrets and variables -> Actions to enable automatic deployments."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "Uploading bundle version $VERSION to Capgo..."
          EXIT_CODE=0
          OUTPUT=$(npx @capgo/cli@latest bundle upload --apikey "$CAPGO_TOKEN" -c production -b "$VERSION" --zip com.xuongan.quanlykho 2>&1) || EXIT_CODE=$?
          echo "$OUTPUT"
          if [ $EXIT_CODE -ne 0 ]; then
            if echo "$OUTPUT" | grep -q "already exists"; then
              echo "::warning::Version $VERSION already exists on Capgo Cloud. Skipping upload as this bundle has already been successfully deployed."
              exit 0
            else
              echo "::error::Capgo bundle upload failed with exit code $EXIT_CODE."
              exit $EXIT_CODE
            fi
          fi
