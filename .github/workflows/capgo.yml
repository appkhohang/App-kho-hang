name: Capgo Live Update

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy-live-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update version with Run Number
        run: |
          node -e "
            const fs = require('fs');
            // Update package.json
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            const newVer = '1.0.${{ github.run_number }}';
            pkg.version = newVer;
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated package.json version to: ' + newVer);
            
            // Update src/types.ts
            if (fs.existsSync('src/types.ts')) {
              let types = fs.readFileSync('src/types.ts', 'utf8');
              const searchReg = /export\s+const\s+CURRENT_VERSION\s*=\s*['\"][^'\"]+['\"]/;
              const replacement = 'export const CURRENT_VERSION = ' + \"'\" + newVer + \"'\";
              types = types.replace(searchReg, replacement);
              fs.writeFileSync('src/types.ts', types, 'utf8');
              console.log('Updated src/types.ts CURRENT_VERSION to: ' + newVer);
            }
          "

      - name: Build production app
        run: npm run build

      - name: Upload and deploy to Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_API_KEY }}
        run: npx @capgo/cli@latest bundle upload --apikey "$CAPGO_TOKEN" -a 9bc744d0-6da2-4d42-9d7e-441b4c25b763 -c production
