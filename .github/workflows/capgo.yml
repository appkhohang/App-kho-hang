name: Capgo Live Update

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy-live-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npm run build

      - name: Upload and deploy to Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_API_KEY }}
        run: npx @capgo/cli@latest bundle upload --apikey "$CAPGO_TOKEN"
