name: Capgo Live Update

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy-live-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build production app
        run: npx vite build

      - name: Upload and deploy to Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_API_KEY }}
        run: |
          if [ -z "$CAPGO_TOKEN" ]; then
            echo "::error::CAPGO_API_KEY secret is not configured in your GitHub repository secrets! Please set CAPGO_API_KEY in your GitHub Settings -> Secrets and variables -> Actions to enable automatic deployments."
            exit 1
          fi
          VERSION=$(node -p "require('./package.json').version")
          echo "Uploading bundle version $VERSION to Capgo..."
          npx @capgo/cli@latest bundle upload --apikey "$CAPGO_TOKEN" -c production -b "$VERSION" 9bc744d0-6da2-4d42-9d7e-441b4c25b763
