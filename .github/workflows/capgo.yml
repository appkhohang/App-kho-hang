name: Capgo Live Update

on:
  push:
    branches:
      - main
      - master

jobs:
  deploy-live-update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Update version with Run Number
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '1.0.${{ github.run_number }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n');
            console.log('Updated version to: ' + pkg.version);
          "

      - name: Build production app
        run: npm run build

      - name: Upload and deploy to Capgo
        env:
          CAPGO_TOKEN: ${{ secrets.CAPGO_API_KEY }}
        run: npx @capgo/cli@latest bundle upload --apikey "$CAPGO_TOKEN" -a 9bc744d0-6da2-4d42-9d7e-441b4c25b763 -c production
