<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>My Google AI Studio App</title>
    <script>
      // Self-healing script to automatically fix missing trailing slash when loading from GitHub Pages
      (function() {
        var host = window.location.hostname;
        var path = window.location.pathname;
        if (
          host.endsWith('.github.io') && 
          path.length > 1 && 
          !path.endsWith('/') && 
          !/\.[a-zA-Z0-9]{2,4}$/.test(path)
        ) {
          window.location.replace(window.location.protocol + '//' + window.location.host + path + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
    <!-- Google Translate Style Overrides & Setup to translation bypass UI -->
    <style>
      iframe.VIpgJd-y666_v-axr, 
      iframe.VIpgJd-y666_v-axr2, 
      .VIpgJd-y666_v-axr, 
      .goog-te-banner-frame, 
      .goog-te-balloon-frame,
      #google_translate_element, 
      .skiptranslate, 
      .goog-te-gadget {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        height: 0 !important;
        width: 0 !important;
      }
      body {
        top: 0px !important;
        position: static !important;
      }
    </style>
  </head>
  <body>
    <!-- Invisible translation anchor -->
    <div id="google_translate_element" style="display:none; visibility:hidden; width:0; height:0;"></div>
    <script type="text/javascript">
      function googleTranslateElementInit() {
        new google.translate.TranslateElement({
          pageLanguage: 'vi',
          includedLanguages: 'en,vi',
          layout: google.translate.TranslateElement.InlineLayout.SIMPLE,
          autoDisplay: false
        }, 'google_translate_element');
      }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
